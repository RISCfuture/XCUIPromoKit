name: Periphery
on:
  push:
    branches: [main]
  pull_request:
jobs:
  periphery:
    runs-on: macos-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Record toolchain version
        id: toolchain
        run: echo "xcode=$(xcodebuild -version | tr '\n' '-')" >> "$GITHUB_OUTPUT"
      - name: Cache SwiftPM build products
        uses: actions/cache@v6
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          key: swiftpm-periphery-macos-latest-${{ steps.toolchain.outputs.xcode }}-${{ hashFiles('Package.resolved') }}
      - name: Install Periphery
        run: brew install periphery-pro/tap/periphery-cli
      - name: Run Periphery
        env:
          PERIPHERY_TOKEN: ${{ secrets.PERIPHERY_TOKEN }}
        run: periphery scan --strict
