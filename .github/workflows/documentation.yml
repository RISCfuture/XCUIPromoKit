name: Deploy Documentation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build Documentation
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Record toolchain version
        id: toolchain
        run: echo "xcode=$(xcodebuild -version | tr '\n' '-')" >> "$GITHUB_OUTPUT"
      - name: Cache SwiftPM build products
        uses: actions/cache@v6
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          key: swiftpm-docs-macos-latest-${{ steps.toolchain.outputs.xcode }}-${{ hashFiles('Package.resolved') }}
      - name: Build documentation
        run: |
          swift package \
            --allow-writing-to-directory ./site \
            generate-documentation \
            --target XCUIPromoKit \
            --disable-indexing \
            --transform-for-static-hosting \
            --hosting-base-path XCUIPromoKit \
            --output-path ./site
      - name: Create root redirect
        run: |
          cat > ./site/index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
              <meta charset="UTF-8">
              <meta http-equiv="refresh" content="0; url=/XCUIPromoKit/documentation/xcuipromokit/">
              <title>XCUIPromoKit Documentation</title>
              <script>
                  window.location.replace("/XCUIPromoKit/documentation/xcuipromokit/");
              </script>
          </head>
          <body>
              <p>Redirecting to <a href="/XCUIPromoKit/documentation/xcuipromokit/">XCUIPromoKit Documentation</a>...</p>
          </body>
          </html>
          EOF
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./site

  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
